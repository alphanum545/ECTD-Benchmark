name: equivalence

# Proves a refactor changes nothing, without scoring the whole corpus.
#
# The full ablation takes ~70s of shard time and exists to measure quality. This
# workflow exists to answer a narrower question: does the patched code produce
# the same schedules as the published implementation? That is a correctness
# question, and it is decidable on a small stratified sample.
#
# Two checks, both cheap:
#   1. Rank equality. The patched descendant_ranks is compared against a frozen
#      copy of the pre-patch set-bit walk on synthetic graphs of both densities
#      and on real corpus instances. Exact equality is required, not tolerance,
#      because the two routines visit bits in the same order and so accumulate
#      the same floats.
#   2. Schedule equality. Every policy and variant is scored on a stratified
#      sample and the makespans are compared against a committed baseline
#      artifact. Any difference is a behaviour change and fails the job.
#
# Trigger: Actions -> equivalence -> Run workflow.

on:
  workflow_dispatch:
    inputs:
      dataset_repo:
        description: "owner/repo holding the corpus"
        required: false
        default: "Techietal/Task-Scheduling-Dataset"
      dataset_ref:
        description: "branch, tag or SHA of the corpus"
        required: false
        default: "main"
      per_cell:
        description: "instances per (family, nodes, processors) cell"
        required: false
        default: "1"
  push:
    branches: [main, "bench/**"]
    paths:
      - "ectdbench/**"
      - "scripts/check_equivalence.py"
      - ".github/workflows/equivalence.yml"

permissions:
  contents: read

env:
  DATASET_REPO: ${{ github.event.inputs.dataset_repo || 'Techietal/Task-Scheduling-Dataset' }}
  DATASET_REF: ${{ github.event.inputs.dataset_ref || 'main' }}
  PER_CELL: ${{ github.event.inputs.per_cell || '1' }}

jobs:
  equivalence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch corpus
        run: |
          set -euo pipefail
          url="https://codeload.github.com/${DATASET_REPO}/tar.gz/refs/heads/${DATASET_REF}"
          curl -sSL --retry 3 --retry-delay 5 --max-time 900 -o corpus.tar.gz "$url"
          mkdir -p corpus
          tar -xzf corpus.tar.gz -C corpus --strip-components=1
          rm -f corpus.tar.gz
          echo "instance files: $(find corpus -name '*.txt' -path '*PROCESSORS*' | wc -l)"

      - name: Check equivalence
        env:
          ECTD_DATA_ROOT: ${{ github.workspace }}/corpus
        run: |
          set -euo pipefail
          python3 scripts/check_equivalence.py \
            --data-root corpus \
            --per-cell "$PER_CELL" \
            --baseline docs/benchmark/equivalence_baseline.json \
            --out equivalence-report.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: equivalence-report
          path: equivalence-report.json
          retention-days: 30
